<section id="certificaciones" class="certifications">
  <div class="container">
    <h2 class="section-title scroll-animate">{{ 'CERTIFICATIONS.TITLE' | translate }}</h2>
    
    <div class="certs-grid">
      <div class="cert-card scroll-animate" *ngFor="let cert of certifications; let i = index" [style.transition-delay]="i * 0.1 + 's'" (click)="openCert(cert)">
        <div class="cert-icon">
          <span>{{ cert.icon }}</span>
        </div>
        <h3 class="cert-name">{{ cert.name }}</h3>
        <p class="cert-issuer">{{ cert.issuer }}</p>
        <p class="cert-date" *ngIf="cert.date">{{ cert.date }}</p>
        <span class="view-badge">{{ 'CERTIFICATIONS.VIEW' | translate }}</span>
      </div>
    </div>
  </div>
</section>

<div class="modal-overlay" [class.visible]="selectedCert" (click)="closeCert()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">{{ selectedCert?.name }}</h3>
      <div class="modal-actions">
        <a [href]="selectedCert?.pdf" download class="download-btn" [attr.aria-label]="'CERTIFICATIONS.DOWNLOAD' | translate">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </a>
        <button class="close-btn" (click)="closeCert()" [attr.aria-label]="'COMMON.CLOSE' | translate">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
    <div class="modal-body">
      <iframe *ngIf="selectedCert" [src]="'assets/' + selectedCert.pdf | safeUrl" [attr.title]="selectedCert.name" class="pdf-viewer"></iframe>
    </div>
  </div>
</div>
